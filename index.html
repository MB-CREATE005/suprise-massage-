<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barua ya Pongezi</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#0f172a,#1e3a8a);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      overflow:hidden;
      color:white;
    }
    .container{
      text-align:center;
      position:relative;
      z-index:2;
    }
    .envelope{
      width:220px;
      height:140px;
      background:#f8fafc;
      position:relative;
      margin:0 auto 20px;
      border-radius:8px;
      cursor:pointer;
      transition:transform .6s;
    }
    .envelope:before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      width:0;
      height:0;
      border-left:110px solid transparent;
      border-right:110px solid transparent;
      border-top:70px solid #e2e8f0;
      transform-origin:top;
      transition:transform .8s;
    }
    .open:before{
      transform:rotateX(180deg);
    }
    .card{
      display:none;
      background:white;
      color:#111827;
      padding:20px;
      border-radius:20px;
      max-width:340px;
      box-shadow:0 20px 40px rgba(0,0,0,.35);
      animation:fadeIn .8s ease;
    }
    .card img{
      width:120px;
      height:120px;
      object-fit:cover;
      border-radius:50%;
      border:4px solid #16a34a;
      margin-bottom:15px;
    }
    h2{
      margin:10px 0;
      color:#166534;
    }
    p{
      line-height:1.6;
    }
    button{
      background:#16a34a;
      color:white;
      border:none;
      padding:12px 22px;
      border-radius:999px;
      font-size:16px;
      cursor:pointer;
    }
    button:hover{
      background:#15803d;
    }
    .watermark{
      margin-top:15px;
      font-size:12px;
      color:#64748b;
    }
    .flower{
      position:absolute;
      top:-20px;
      font-size:22px;
      animation:fall linear infinite;
      opacity:.9;
    }
    @keyframes fall{
      to{
        transform:translateY(110vh) rotate(360deg);
      }
    }
    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="envelope" id="envelope" onclick="openCard()"></div>
    <button id="btn" onclick="openCard()">Fungua Barua</button>

    <div class="card" id="card">
      <img src="dr-mbarak.jpg" alt="Dr. Mbarak Bahjaj">
      <h2>Hongera Mheshimiwa Dr. Mbarak Bahjaj</h2>
      <p>
        Tunakutakia kila la kheri, afya njema, mafanikio na uongozi wenye
        baraka. Mwenyezi Mungu akuongezee hekima, nguvu na ufanisi katika
        kuwatumikia wananchi wa Lamu.
      </p>
      <p><strong>MB CREATE</strong> inakutakia maendeleo makubwa na ushindi.</p>
      <div class="watermark">© MB CREATE</div>
    </div>

    <audio id="bgm" loop>
      <source src="music.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script>
    function openCard(){
      document.getElementById("envelope").classList.add("open");
      document.getElementById("card").style.display="block";
      document.getElementById("btn").style.display="none";
      const music=document.getElementById("bgm");
      music.play().catch(()=>{});
      for(let i=0;i<30;i++){
        const f=document.createElement("div");
        f.className="flower";
        f.innerHTML="🌹";
        f.style.left=Math.random()*100+"vw";
        f.style.animationDuration=(4+Math.random()*4)+"s";
        document.body.appendChild(f);
      }
    }
  </script>
</body>
</html>
